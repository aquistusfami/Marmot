[project]
name = "marmot-tui"
dynamic = ["version"]
description = "Clean, uninstall, analyze, optimize and monitor Linux (apt / pacman) from the terminal."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["textual>=1.0", "rich>=13"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/aquistusfami/Marmot"
Issues = "https://github.com/aquistusfami/Marmot/issues"

[project.scripts]
marmot = "marmot.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marmot"]

[tool.hatch.version]
path = "src/marmot/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["marmot"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
