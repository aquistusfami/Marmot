name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked ruff check --output-format=github

  test:
    name: test (Debian/Ubuntu, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked pytest -q --cov --cov-report=term-missing

  test-arch:
    name: test (Arch Linux, pacman backend)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed python uv git
      - uses: actions/checkout@v4
      - run: uv run --locked pytest -q

  build:
    needs: [lint, test, test-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Smoke-test the built wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c "import marmot.app, marmot; print(marmot.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
