name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches package version
        run: |
          version=$(uv run --no-project python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/marmot/__init__.py').read())[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME != __version__ $version"; exit 1; }
      - run: uv run --locked ruff check
      - run: uv run --locked pytest -q
      - run: uv build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Marmot $GITHUB_REF_NAME" --generate-notes
