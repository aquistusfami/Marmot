name: Bug report
description: Something in Marmot does not work as expected
labels: [bug]
body:
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: "Debian 13 / Arch (2026-11) / Ubuntu 24.04 ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Marmot version and install method
      placeholder: "1.1.0 via uv tool install"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (tab, button, package name...)
  - type: markdown
    attributes:
      value: "Security issue (e.g. Marmot deleted something it should not)? Report it privately, see SECURITY.md."
